version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: servicesphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-servicesphere}
      POSTGRES_USER: ${DB_USERNAME:-servicesphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-servicesphere} -d ${DB_NAME:-servicesphere}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - servicesphere-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicesphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-servicesphere}
      DB_USERNAME: ${DB_USERNAME:-servicesphere}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - servicesphere-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servicesphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - servicesphere-network

volumes:
  postgres_data:
    driver: local

networks:
  servicesphere-network:
    driver: bridge
